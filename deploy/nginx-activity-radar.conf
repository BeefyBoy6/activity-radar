# Activity Radar — nginx reverse proxy with HTTP basic authentication.
# This file is included inside nginx's http{} context.

limit_req_zone $binary_remote_addr zone=activity_radar_auth:10m rate=30r/m;

server {
    listen 80;
    server_name activityradar.in;

    auth_basic "Activity Radar";
    auth_basic_user_file /etc/nginx/.htpasswd-activity-radar;

    # Basic browser hardening. Certbot will add the HTTPS listener; add HSTS
    # only after HTTPS is confirmed working.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        # Slows repeated basic-auth guessing without interfering with normal SPA use.
        limit_req zone=activity_radar_auth burst=60 nodelay;

        proxy_pass http://127.0.0.1:8033;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

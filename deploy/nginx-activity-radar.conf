# Activity Radar — proxied behind nginx with HTTP basic auth.
# This is a personal family app (settings, scrape triggers, your kid's
# interests) — do not expose it without the auth_basic lines.
#
# Install:
#   sudo cp nginx-activity-radar.conf /etc/nginx/sites-available/activity-radar
#   sudo ln -s /etc/nginx/sites-available/activity-radar /etc/nginx/sites-enabled/
#   sudo htpasswd -c /etc/nginx/.htpasswd-activity-radar <username>   (choose your own password)
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d activities.bigbeefslottools.com           (after DNS A record exists)

server {
    listen 80;
    server_name activities.bigbeefslottools.com;  # adjust if you pick a different subdomain

    auth_basic "Activity Radar";
    auth_basic_user_file /etc/nginx/.htpasswd-activity-radar;

    location / {
        proxy_pass http://127.0.0.1:8033;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
